<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Mouvements de Stock - SAP Fiori</title>

    <style>
        html, body, #content, body > div {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>

    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-libs="sap.m, sap.fe.core, sap.fe.macros, sap.fe.templates"
        data-sap-ui-async="true"
        data-sap-ui-preload="async"
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-flexibility-services='[{"connector": "LocalStorageConnector"}]'
        data-sap-ui-resource-roots='{
            "stockmovements": "./"
        }'>
    </script>

    <!-- Shell bar commune : navigation + utilisateur connecté -->
    <script src="/app/shellbar.js" defer></script>
</head>

<body class="sapUiBody sapUiSizeCompact" id="content"
      data-app-title="Mouvements de Stock">
    <div
        data-sap-ui-component
        data-name="stockmovements"
        data-id="container"
        data-height="100%"
        data-settings='{"id": "stockmovements"}'
        data-handle-validation="true">
    </div>
</body>
</html>
