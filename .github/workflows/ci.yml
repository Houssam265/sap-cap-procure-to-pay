name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Job quality : Linting, Formatage, Tests unitaires et Couverture
  # ============================================================================
  quality:
    name: Quality (Lint, Format, Test & Coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint source code (ESLint)
        run: npm run lint

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: Run unit & integration tests
        run: npm test

      - name: Run test coverage
        run: npm run test:coverage | tee coverage-report.txt

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-report.txt
          retention-days: 14

  # ============================================================================
  # 2. Job docker-build : Construction de l'image avec Buildx et cache GitHub
  # ============================================================================
  docker-build:
    name: Docker Build & Cache
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with GitHub Actions cache (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: sap-cap-procure-to-pay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. Job e2e : Validation bout-en-bout sous Docker Compose et conteneur isolé
  # ============================================================================
  e2e:
    name: End-to-End Tests (Docker Compose & Standalone Container)
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Docker Compose environment (PostgreSQL + App)
        run: docker compose up -d --wait

      - name: Run E2E suite against demo container (http://localhost:4004)
        run: pwsh scripts/test-e2e.ps1 -BaseUrl http://localhost:4004

      - name: Start isolated container without demo mode (fail-closed, port 4005)
        run: |
          docker compose run -d --name ptp-nodemo -p 127.0.0.1:4005:4004 -e PTP_DEMO_MODE=false app

      - name: Wait for isolated container health readiness
        run: |
          timeout 30s bash -c 'until wget -qO- http://127.0.0.1:4005/health > /dev/null 2>&1; do sleep 1; done'

      - name: Run E2E suite against non-demo container (http://localhost:4005)
        run: pwsh scripts/test-e2e.ps1 -BaseUrl http://localhost:4005

      - name: Capture Docker logs on failure
        if: failure()
        run: |
          echo "=== Logs Docker Compose ==="
          docker compose logs --no-color
          echo "=== Logs conteneur ptp-nodemo ==="
          docker logs ptp-nodemo --no-color || true

      - name: Teardown Docker environments
        if: always()
        run: |
          docker rm -f ptp-nodemo 2>/dev/null || true
          docker compose down -v
